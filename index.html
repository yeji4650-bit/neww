<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wedding Book | 마이 웨딩 북</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons for modern UI -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Pinterest Widget Script -->
  <script async defer src="//assets.pinterest.com/js/pinit.js"></script>
</head>
<body>
  
  <div id="loading-screen" class="flex align-center justify-center" style="position: fixed; inset: 0; background: var(--bg-color); z-index: 2000;">
    <div class="serif" style="font-size: 1.5rem; color: var(--accent-color); animation: pulse 1.5s infinite;">My Wedding Book...</div>
  </div>

  <wedding-nav id="main-nav" style="display: none;"></wedding-nav>

  <main id="app-root" class="container fade-in">
    <!-- Views will be injected here -->
  </main>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <script type="module" src="main.js"></script>
</body>
</html>
